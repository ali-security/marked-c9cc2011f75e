name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Jasmine --filter regex; empty runs the full suite'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ['lts/*', 'node']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:unit -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:specs -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      - name: Build 🗜️
        if: matrix.node_version == 'lts/*'
        run: npm run build
      - name: Pack 📦
        if: matrix.node_version == 'lts/*'
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
      - name: Upload package
        if: matrix.node_version == 'lts/*'
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: dist-pack/*.tgz
          if-no-files-found: error

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
